name: Remax Scraper

on:
  schedule:
    - cron: '0 7 * * *'   # Daily at 07:00 UTC
  workflow_dispatch:
    inputs:
      zones:
        description: 'Zonas separadas por vírgula (ex: Lisboa,Cascais)'
        required: false
        default: ''
      max_price:
        description: 'Preço máximo em €'
        required: false
        default: ''
      typologies:
        description: 'Tipologias separadas por vírgula (ex: T2,T3)'
        required: false
        default: ''
      lead_id:
        description: 'UUID da lead (opcional — para acionar a partir do perfil)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./scrapers
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Remax scraper
        working-directory: ./scrapers
        env:
          CRM_API_URL: ${{ secrets.CRM_API_URL }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          REMAX_ZONES: ${{ inputs.zones || vars.REMAX_ZONES }}
          REMAX_MAX_PRICE: ${{ inputs.max_price || vars.REMAX_MAX_PRICE }}
          REMAX_TYPOLOGIES: ${{ inputs.typologies || vars.REMAX_TYPOLOGIES }}
          LEAD_ID: ${{ inputs.lead_id }}
        run: python remax_scraper.py
